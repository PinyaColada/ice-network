[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ice-network"
version = "0.1.0"
description = "The chiringuito that never runs out of ice (terms and melting apply)."
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.2.6", "pandas==2.2.3", "matplotlib==3.10.3",
  "scikit-learn==1.6.1", "pyscipopt==5.5.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13"]

[project.scripts]
ice-network = "ice_network.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ice_network = ["web/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
